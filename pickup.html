<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0d" />
    <title>取件码 · 校园快递</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="返回首页">
          <span class="brand-mark">取</span>
          <span>校园快递</span>
        </a>
        <span class="header-status"><i></i>今日 3 件待取</span>
      </header>

      <!-- 同学 A 负责本页：只在 main 里改功能 -->
      <main id="app-content" class="screen" tabindex="-1">
        <div class="subscreen-head">
          <a class="back-button" href="index.html" aria-label="返回首页">‹</a>
          <div>
            <h1>取件码</h1>
            <small>数字码、货架号和夹层信息放在一起</small>
          </div>
        </div>

        <article class="detail-card">
          <p class="detail-kicker">菜鸟驿站 · 待取包裹</p>
          <h2>取件码</h2>
          <div class="detail-code"><span>582</span> 462</div>
          <div class="detail-grid">
            <div class="meta-box"><span class="meta-label">货架号</span><strong class="meta-value">A-03</strong></div>
            <div class="meta-box"><span class="meta-label">夹层</span><strong class="meta-value">2 层</strong></div>
            <div class="meta-box"><span class="meta-label">格位</span><strong class="meta-value">18 格</strong></div>
            <div class="meta-box"><span class="meta-label">包裹平台</span><strong class="meta-value">京东</strong></div>
          </div>
          <button class="wide-action copy-code" type="button">复制取件码</button>
        </article>

        <a class="detail-card" href="map.html">
          <p class="detail-kicker">已经拿到取件码</p>
          <h2>下一步去哪个货架？</h2>
          <div class="map-card-footer"><strong>A-03 · 夹层 2</strong><span>打开地图 →</span></div>
        </a>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <a href="index.html"><span>⌂</span><small>首页</small></a>
        <a href="map.html"><span>⌖</span><small>驿站地图</small></a>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      // 同学 A 的功能脚本写在这里
      const toast = document.getElementById('toast');

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('visible'), 2200);
      }

      document.querySelector('.copy-code').addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText('582462');
          showToast('取件码已复制');
        } catch {
          showToast('取件码 582462');
        }
      });
    </script>
  </body>
</html>
