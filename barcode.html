<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0d" />
    <title>身份码 · 校园快递</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="返回首页">
          <span class="brand-mark">取</span>
          <span>校园快递</span>
        </a>
        <span class="header-status"><i></i>今日 3 件待取</span>
      </header>

      <!-- 同学 B 负责本页：只在 main 里改功能 -->
      <main id="app-content" class="screen" tabindex="-1">
        <div class="subscreen-head">
          <a class="back-button" href="index.html" aria-label="返回首页">‹</a>
          <div>
            <h1>身份码</h1>
            <small>条形码用于驿站出库身份验证</small>
          </div>
        </div>

        <article class="detail-card">
          <p class="detail-kicker">菜鸟驿站 · 演示</p>
          <h2>身份条形码</h2>
          <div class="barcode-box large" id="identityBarcode" aria-label="身份码示意条形码"></div>
          <div class="barcode-label"><span>示意尾号</span><strong id="identityTail" aria-live="polite"></strong></div>
          <button class="wide-action soft-action refresh-identity" type="button">刷新示意条形码</button>
          <p class="long-note">示意条形码仅供演示，不能用于驿站扫码。</p>
        </article>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <a href="index.html"><span>⌂</span><small>首页</small></a>
        <a href="map.html"><span>⌖</span><small>驿站地图</small></a>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      const toast = document.getElementById('toast');
      const barcodeBox = document.getElementById('identityBarcode');
      const tailLabel = document.getElementById('identityTail');
      const minTail = 1000;
      const tailCount = 9000;
      let identityTail = minTail + Math.floor(Math.random() * tailCount);

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('visible'), 2200);
      }

      function paint(tail) {
        const digits = String(tail);
        const bars = document.createDocumentFragment();
        // 每位数字用四对长短条纹表示，图案仅用于演示。
        for (const digit of digits) {
          for (const mask of [8, 4, 2, 1]) {
            const firstIsTall = (Number(digit) & mask) !== 0;
            const first = document.createElement('i');
            const second = document.createElement('i');
            first.style.height = firstIsTall ? '80%' : '48%';
            second.style.height = firstIsTall ? '48%' : '80%';
            first.setAttribute('aria-hidden', 'true');
            second.setAttribute('aria-hidden', 'true');
            bars.append(first, second);
          }
        }
        barcodeBox.replaceChildren(bars);
        tailLabel.textContent = digits;
      }

      document.querySelector('.refresh-identity').addEventListener('click', () => {
        // 跳过当前尾号，确保每次点击可见变化。
        const next = minTail + Math.floor(Math.random() * (tailCount - 1));
        identityTail = next >= identityTail ? next + 1 : next;
        paint(identityTail);
        showToast('示意身份码已刷新');
      });

      paint(identityTail);
    </script>
  </body>
</html>
