<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b0d" />
    <title>身份码 · 校园快递</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-frame">
      <header class="app-header">
        <a class="brand" href="index.html" aria-label="返回首页">
          <span class="brand-mark">取</span>
          <span>校园快递</span>
        </a>
        <span class="header-status"><i></i>今日 3 件待取</span>
      </header>

      <!-- 同学 B 负责本页：只在 main 里改功能 -->
      <main id="app-content" class="screen" tabindex="-1">
        <div class="subscreen-head">
          <a class="back-button" href="index.html" aria-label="返回首页">‹</a>
          <div>
            <h1>身份码</h1>
            <small>条形码用于驿站出库身份验证</small>
          </div>
        </div>

        <article class="detail-card">
          <p class="detail-kicker">菜鸟驿站 · 签收身份码</p>
          <h2>身份条形码</h2>
          <div class="barcode-box large" id="identityBarcode" aria-label="身份码示意条形码"></div>
          <div class="barcode-label"><span>身份码尾号</span><strong id="identityTail">2816</strong></div>
          <button class="wide-action soft-action refresh-identity" type="button">刷新示意条形码</button>
        </article>
      </main>

      <nav class="bottom-nav" aria-label="主导航">
        <a href="index.html"><span>⌂</span><small>首页</small></a>
        <a href="map.html"><span>⌖</span><small>驿站地图</small></a>
      </nav>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
      // 同学 B 的功能脚本写在这里
      const toast = document.getElementById('toast');
      const barcodeBox = document.getElementById('identityBarcode');
      const tailLabel = document.getElementById('identityTail');
      let identityTail = '2816';

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toast.classList.remove('visible'), 2200);
      }

      function renderBarcode(seed = 4) {
        return Array.from({ length: 32 }, (_, index) => {
          const value = (index * 11 + seed * 5 + 7) % 10;
          const width = value % 4 === 0 ? 3 : 2;
          const height = 43 + value * 5;
          return `<i style="width:${width}px;height:${height}%"></i>`;
        }).join('');
      }

      function paint() {
        barcodeBox.innerHTML = renderBarcode(Number(identityTail.slice(-2)));
        tailLabel.textContent = identityTail;
      }

      document.querySelector('.refresh-identity').addEventListener('click', () => {
        identityTail = String(Math.floor(1000 + Math.random() * 9000));
        paint();
        showToast('示意身份码已刷新');
      });

      paint();
    </script>
  </body>
</html>
